name: Grading System

on:
  push:
    branches:
      - main
      - master
      - 'ntuos2026/*'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  workflow_dispatch: {}

jobs:
  mp-setup:
    runs-on: ubuntu-slim
    outputs:
      image:            ${{ steps.vars.outputs.image }}
      options:          ${{ steps.vars.outputs.options }}
      fail:             ${{ steps.verify.outputs.fail }}
      target_sha:       ${{ steps.verify.outputs.target_sha }}
      target_timestamp: ${{ steps.verify.outputs.target_timestamp }}
      target_author:    ${{ steps.verify.outputs.target_author }}
    steps:
      - name: Optimize Git and Checkout
        run: |
          # Disable compression for faster network transfer.
          git config --global core.compression 0
          # Turn off fsync
          git config --global core.fsync -all

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history for commit verification
          sparse-checkout: |
            mp.conf
            grade/verify_committer.py

      - name: Verify Student Identity
        id: verify
        run: |
          fail=false
          if ! python3 grade/verify_committer.py; then
            fail=true
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
        env:
          PYTHONUNBUFFERED: "1"

      - id: vars
        if: steps.verify.outputs.fail != 'true'
        run: |
          source mp.conf
          IMAGE_NAME="${ACTION_IMAGE:-ntuos/mpx}"
          IMAGE_OPTIONS=(
            "--user root"
          )
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "options=${IMAGE_OPTIONS[*]}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build xv6 and discover tests; validate dependency DAG
  # ---------------------------------------------------------------------------
  build-discover:
    needs: mp-setup
    if: needs.mp-setup.outputs.fail != 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.mp-setup.outputs.image }}
      options: ${{ needs.mp-setup.outputs.options }}
    outputs:
      wave_0_matrix:   ${{ steps.discover.outputs.wave_0_matrix }}
      wave_1_matrix:   ${{ steps.discover.outputs.wave_1_matrix }}
      has_wave_1:      ${{ steps.discover.outputs.has_wave_1 }}
      wave_seq_matrix: ${{ steps.discover.outputs.wave_seq_matrix }}
      has_wave_seq:    ${{ steps.discover.outputs.has_wave_seq }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Restore Student Files at target_sha
        env:
          TARGET_SHA: ${{ needs.mp-setup.outputs.target_sha }}
        run: bash scripts/restore-target-files

      - name: Build xv6
        run: make

      - name: Discover Tests
        id: discover
        run: python3 grade/discover.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Fail on Dependency Cycle
        if: steps.discover.outputs.cycle_detected == 'true'
        run: |
          echo "::error::Dependency cycle detected in test definitions — aborting."
          exit 1

  # ---------------------------------------------------------------------------
  # Wave 0: run each depth-0 test in parallel
  # ---------------------------------------------------------------------------
  wave-0:
    name: wave-0 (${{ matrix.test.name }})
    needs: [mp-setup, build-discover]
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.mp-setup.outputs.image }}
      options: ${{ needs.mp-setup.outputs.options }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.build-discover.outputs.wave_0_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Restore Student Files at target_sha
        env:
          TARGET_SHA: ${{ needs.mp-setup.outputs.target_sha }}
        run: bash scripts/restore-target-files

      - name: Run Test — ${{ matrix.test.name }}
        run: |
          mkdir -p results
          python3 grade/run.py \
            --json "results/${{ matrix.test.slug }}.json" \
            "${{ matrix.test.pattern }}"
        env:
          PYTHONUNBUFFERED: "1"
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}

      - name: Upload Test Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.test.slug }}
          retention-days: 1
          path: results/

  # ---------------------------------------------------------------------------
  # Wave 1: run each depth-1 test in parallel (self-contained: aggregates wave-0 results)
  # ---------------------------------------------------------------------------
  wave-1:
    name: wave-1 (${{ matrix.test.name }})
    needs: [mp-setup, build-discover, wave-0]
    if: always() && needs.mp-setup.outputs.fail != 'true' && needs.build-discover.outputs.has_wave_1 == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.mp-setup.outputs.image }}
      options: ${{ needs.mp-setup.outputs.options }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.build-discover.outputs.wave_1_matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Restore Student Files at target_sha
        env:
          TARGET_SHA: ${{ needs.mp-setup.outputs.target_sha }}
        run: bash scripts/restore-target-files

      - name: Download Wave-0 Results
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results/
          merge-multiple: true
        continue-on-error: true

      - name: Compute Score and History
        id: score
        run: python3 grade/compute_public_score.py --results-dir results/ --history grades_history.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run Test — ${{ matrix.test.name }}
        run: |
          mkdir -p results
          python3 grade/run.py \
            --inject-total    "${{ steps.score.outputs.total }}" \
            --inject-possible "${{ steps.score.outputs.possible }}" \
            --inject-history  grades_history.json \
            --json "results/${{ matrix.test.slug }}.json" \
            "${{ matrix.test.pattern }}"
        env:
          PYTHONUNBUFFERED: "1"
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}

      - name: Upload Test Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-wave1-${{ matrix.test.slug }}
          retention-days: 1
          path: results/

  # ---------------------------------------------------------------------------
  # Sequential overflow: depth >= 2 tests run in topo order (self-contained)
  # ---------------------------------------------------------------------------
  wave-seq:
    needs: [mp-setup, build-discover, wave-0, wave-1]
    if: always() && needs.mp-setup.outputs.fail != 'true' && needs.build-discover.outputs.has_wave_seq == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.mp-setup.outputs.image }}
      options: ${{ needs.mp-setup.outputs.options }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Restore Student Files at target_sha
        env:
          TARGET_SHA: ${{ needs.mp-setup.outputs.target_sha }}
        run: bash scripts/restore-target-files

      - name: Download All Prior Results
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results/
          merge-multiple: true
        continue-on-error: true

      - name: Compute Score and History
        id: score
        run: python3 grade/compute_public_score.py --results-dir results/ --history grades_history.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run Sequential Overflow Tests
        run: |
          mkdir -p results
          python3 - <<'PYEOF'
          import json, subprocess, sys, os
          tests = json.loads(os.environ["WAVE_SEQ_MATRIX"])
          for t in tests:
              subprocess.run([
                  sys.executable, "grade/run.py",
                  "--inject-total",    os.environ["SCORE_TOTAL"],
                  "--inject-possible", os.environ["SCORE_POSSIBLE"],
                  "--inject-history",  "grades_history.json",
                  "--json", f"results/{t['slug']}.json",
                  t["pattern"],
              ], check=False)
          PYEOF
        env:
          PYTHONUNBUFFERED: "1"
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
          WAVE_SEQ_MATRIX: ${{ needs.build-discover.outputs.wave_seq_matrix }}
          SCORE_TOTAL:     ${{ steps.score.outputs.total }}
          SCORE_POSSIBLE:  ${{ steps.score.outputs.possible }}

      - name: Upload Sequential Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-wave-seq
          retention-days: 1
          path: results/

  # ---------------------------------------------------------------------------
  # Aggregate all results into final report
  # ---------------------------------------------------------------------------
  report:
    needs: [mp-setup, build-discover, wave-0, wave-1, wave-seq]
    if: always()
    runs-on: ubuntu-slim

    steps:
      - name: Checkout Repository
        if: needs.mp-setup.outputs.fail != 'true'
        uses: actions/checkout@v6

      - name: Download All Results
        if: needs.mp-setup.outputs.fail != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results/
          merge-multiple: true
        continue-on-error: true

      - name: Reconstruct Target Commit Info
        if: needs.mp-setup.outputs.fail != 'true'
        run: |
          printf '{"sha":"%s","author":"%s","timestamp":%s}\n' \
            "${{ needs.mp-setup.outputs.target_sha }}" \
            "${{ needs.mp-setup.outputs.target_author }}" \
            "${{ needs.mp-setup.outputs.target_timestamp }}" \
            > target_commit.json

      - name: Record Build Failure
        if: needs.build-discover.result == 'failure' && needs.mp-setup.outputs.fail != 'true'
        run: |
          mkdir -p results
          cat > results/build-fail.json << 'ENDJSON'
          {
            "test_case": "Build/Setup",
            "status": "FAIL",
            "score": 0,
            "max_score": 0,
            "order": -1,
            "output": "Compilation failed (make error)"
          }
          ENDJSON

      - name: Aggregate Results
        if: needs.mp-setup.outputs.fail != 'true'
        run: |
          python3 grade/aggregate_results.py \
            --results-dir results/ \
            --json report.json \
            --markdown grade-report.md
        env:
          PYTHONUNBUFFERED: "1"
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}

      - name: Add Visual Summary
        if: always()
        run: |
          if [ "${{ needs.mp-setup.outputs.fail }}" = "true" ]; then
            echo "## Grading Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Fail to compile or Commits by TAs are not graded." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f grade-report.md ]; then
            cat grade-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Final Report
        if: always() && needs.mp-setup.outputs.fail != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: grading-report
          path: report.json

      - name: Delete Temporary Artifacts
        if: needs.mp-setup.outputs.fail != 'true'
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
              result-*
