name: Grading System

on:
  push:
    branches:
      - main
      - master
      - 'ntuos2026/*'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout + GraphQL pushedDate
      actions: read    # workflow-run fallback for push time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history for commit verification

      - name: Trust Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Student Identity
        id: verify
        run: |
          # Resolve the commit to grade and its authoritative push time
          python3 grade/verify_committer.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"

      - name: Pin Graded Sources to Target Commit
        env:
          TARGET_SHA: ${{ steps.verify.outputs.target_sha }}
        run: bash scripts/pin-graded-sources

      - name: Execute Tests (Grading)
        id: test
        run: |
          ./mp.sh grade --json report.json --markdown grade-report.md
        env:
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}

      - name: Add Visual Summary
        if: always()
        run: |
          if [ -f grade-report.md ]; then
            cat grade-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grading-report
          path: report.json
