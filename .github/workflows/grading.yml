name: Grading System

on:
  push:
    branches:
      - main
      - master
      - 'ntuos2026/*'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout the repo
      actions: read    # query workflow_runs for the authoritative push time

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history for commit verification

      - name: Trust Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify Student Identity
        id: verify
        run: |
          # Resolve the commit to grade and its authoritative push time.
          # Translate the exit code into a step output so downstream steps can
          # render a useful summary instead of a silent red X (audit C3).
          if python3 grade/verify_committer.py; then
            echo "fail=false" >> "$GITHUB_OUTPUT"
          else
            echo "fail=true"  >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"

      - name: Pin Graded Sources to Target Commit
        if: steps.verify.outputs.fail != 'true'
        env:
          TARGET_SHA: ${{ steps.verify.outputs.target_sha }}
        run: bash scripts/pin-graded-sources

      - name: Execute Tests (Grading)
        id: test
        if: steps.verify.outputs.fail != 'true'
        run: |
          ./mp.sh grade --json report.json --markdown grade-report.md
        env:
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}

      - name: Add Visual Summary
        if: always()
        run: |
          if [ "${{ steps.verify.outputs.fail }}" = "true" ]; then
            {
              echo "## Grading Skipped"
              echo
              echo "No student commit could be identified for this run "
              echo "(all commits are TA-authored, or no parented commit exists)."
              echo "If this is a freshly created repo, push your first commit "
              echo "as the student and grading will run."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f grade-report.md ]; then
            cat grade-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Artifact
        if: always() && steps.verify.outputs.fail != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: grading-report
          path: report.json
